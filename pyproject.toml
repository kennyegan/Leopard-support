[project]
name = "techspot-assist"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.3,<1",
    "fastembed>=0.6,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.8,<3",
    "authlib>=1.6,<2",
    "itsdangerous>=2.2,<3",
    "psycopg-pool>=3.2,<4",
    "joserfc>=1.7,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["apps/api", "."]
testpaths = ["apps/api/tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
