pid /tmp/nginx.pid;
worker_processes auto;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client-body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 20k;
  client_body_timeout 10s;
  client_header_timeout 10s;
  keepalive_timeout 15s;
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=ingress:10m rate=30r/s;
  limit_conn_zone $binary_remote_addr zone=connections:10m;
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream backend { zone backend 64k; server api:8000 resolve; server api2:8000 resolve; }
  upstream frontend { zone frontend 64k; server web:3000 resolve; }
  server {
    listen 8443 ssl;
    ssl_certificate /run/tls/cert.pem;
    ssl_certificate_key /run/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    limit_req zone=ingress burst=120 nodelay;
    limit_req_status 429;
    limit_conn connections 100;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 25s;
    proxy_next_upstream off;
    location /api/ { proxy_pass http://backend; }
    location / { proxy_pass http://frontend; }
  }
}
